<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkGuard Session</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:620px;margin:5vh auto;padding:24px}.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 10px 35px #0001}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700}video{width:100%;border-radius:16px;background:#111;margin-top:16px;display:none}.status{padding:12px;background:#f1f4f8;border-radius:12px;margin:14px 0;line-height:1.5}.small{font-size:13px;color:#667085;line-height:1.6}</style></head><body><main><div class="card"><h1>LinkGuard</h1><p>Untuk melanjutkan sesi, Anda akan diminta memberikan izin <b>kamera depan</b> dan <b>lokasi</b>. Akses hanya berjalan setelah Anda menyetujui permintaan browser.</p><div class="status" id="status">Memeriksa sesi...</div><button id="start" disabled>Mulai Sesi</button><video id="preview" autoplay playsinline muted></video><p class="small">Anda dapat menghentikan sesi dengan menutup halaman. Kamera tidak direkam atau disimpan oleh halaman ini.</p></div></main><script>const SB_URL='https://xvhimyflrqrdudijwjdn.supabase.co',SB_KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',token=new URLSearchParams(location.search).get('token'),statusEl=document.getElementById('status'),btn=document.getElementById('start'),video=document.getElementById('preview');let stream=null,watchId=null,last={lat:null,lon:null,accuracy:null};async function rpc(name,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}async function check(){if(!token){statusEl.textContent='Link sesi tidak lengkap.';return}try{const d=await rpc('get_tracking_session',{p_token:token});const s=Array.isArray(d)?d[0]:d;if(!s){statusEl.textContent='Sesi tidak ditemukan atau sudah kedaluwarsa.';return}statusEl.textContent='Sesi tersedia. Tekan Mulai Sesi untuk memberikan izin.';btn.disabled=false}catch(e){statusEl.textContent='Gagal memeriksa sesi: '+e.message}}async function send(){if(!last.lat)return;try{await rpc('ingest_tracking_telemetry',{p_token:token,p_latitude:last.lat,p_longitude:last.lon,p_accuracy:last.accuracy,p_camera_permission:!!stream,p_location_permission:true,p_platform:navigator.platform||null,p_model:null,p_user_agent:navigator.userAgent||null})}catch(e){console.warn(e)}}async function start(){btn.disabled=true;statusEl.textContent='Meminta izin kamera...';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}},audio:false});video.srcObject=stream;video.style.display='block';statusEl.textContent='Kamera diizinkan. Meminta lokasi...'}catch(e){stream=null;statusEl.textContent='Kamera belum diizinkan: '+e.message}if(!navigator.geolocation){statusEl.textContent+=' GPS tidak didukung browser ini.';return}watchId=navigator.geolocation.watchPosition(async p=>{last={lat:p.coords.latitude,lon:p.coords.longitude,accuracy:p.coords.accuracy};statusEl.textContent='Sesi aktif • GPS ±'+Math.round(p.coords.accuracy)+' m';await send()},e=>{statusEl.textContent='Kamera aktif, tetapi lokasi belum diizinkan: '+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:3000});await send();setInterval(send,5000)}btn.onclick=start;window.addEventListener('beforeunload',()=>{if(watchId!==null)navigator.geolocation.clearWatch(watchId);if(stream)stream.getTracks().forEach(t=>t.stop())});check();</script></body></html>
