<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Cafe — Admin Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#172033}.w{max-width:1180px;margin:auto;padding:24px}.hero{background:#172033;color:#fff;border-radius:20px;padding:26px;margin-bottom:18px}.hero h1{margin:0 0 6px}.muted{color:#687386}.hero .muted{color:#cbd3df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0001}.num{font-size:30px;font-weight:800}.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:18px 0;flex-wrap:wrap}.search{display:flex;gap:10px;flex:1;min-width:260px}input,select,button{padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}input{width:100%}button{background:#172033;color:#fff;cursor:pointer}.danger{background:#fff0f0;color:#a11}.tenant{border-top:1px solid #edf0f4;padding:18px 0}.head{display:flex;justify-content:space-between;gap:15px;align-items:center}.name{font-size:19px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.trial{background:#fff3c4;color:#8a5b00}.active{background:#dcfce7;color:#166534}.expired,.suspended{background:#fee2e2;color:#991b1b}.mods{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.mod{display:block;text-decoration:none;background:#f6f8fa;color:#172033;border:1px solid #e5e8ed;padding:11px 8px;border-radius:10px;text-align:center;font-size:12px;font-weight:700}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.box{background:#fff;border-radius:18px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto}.fields{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.msg{padding:10px;border-radius:10px;background:#eef3f8;margin:10px 0}.hide{display:none}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.mods{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.w{padding:14px}.row{grid-template-columns:1fr}.mods{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="w"><section class="hero"><h1>Σ Sigma Cafe</h1><div class="muted">Commercial Admin Center — kelola seluruh cafe penyewa.</div></section><section id="login" class="card"><h2>Login Admin</h2><p class="muted">Masuk untuk melihat dan menambah penyewa.</p><div class="fields"><input id="email" type="email" value="admin@sigmacafe.local" placeholder="Email admin"><input id="pass" type="password" placeholder="Password admin"><button id="loginBtn">Masuk</button><div id="loginMsg"></div></div></section><section id="app" class="hide"><section class="grid"><div class="card"><div class="muted">Total Penyewa</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">Aktif</div><div class="num" id="active">0</div></div><div class="card"><div class="muted">Trial</div><div class="num" id="trial">0</div></div><div class="card"><div class="muted">Expired</div><div class="num" id="expired">0</div></div></section><div class="bar"><div class="search"><input id="q" placeholder="Cari nama cafe / kode..."><select id="filter"><option value="">Semua status</option><option value="active">Aktif</option><option value="trial">Trial</option><option value="suspended">Suspended</option><option value="expired">Expired</option></select></div><button id="add">+ Tambah Cafe</button><button id="logout" class="danger">Keluar</button></div><section class="card"><h2 style="margin-top:0">Daftar Penyewa</h2><div id="list"></div></section></section></main><div id="modal" class="modal"><div class="box"><h2>Daftarkan Penyewa Baru</h2><p class="muted">Buat akun cafe dan masa berlangganannya.</p><div class="fields"><div class="row"><input id="cafe" placeholder="Nama Cafe *"><input id="code" placeholder="Kode tenant *"></div><div class="row"><input id="slug" placeholder="Slug *"><input id="owner" placeholder="Nama Owner"></div><div class="row"><input id="package" value="Commercial" placeholder="Paket"><input id="days" type="number" min="1" value="30" placeholder="Hari langganan"></div><div class="row"><input id="loginid" placeholder="ID Login *"><input id="pw" type="password" placeholder="Password * (min. 6)"></div><div id="formMsg"></div><div class="row"><button id="save">Simpan Penyewa</button><button id="cancel" class="danger">Batal</button></div></div></div></div><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let adminToken='',all=[];const $=id=>document.getElementById(id);async function rpc(name,body){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.message||'Backend error');return j}async function login(){loginMsg.textContent='Memeriksa...';try{const j=await rpc('sigma_admin_login',{p_email:email.value,p_password:pass.value});if(!j.ok)throw Error(j.message);adminToken=j.token;sessionStorage.setItem('sigma_admin_token',adminToken);login.classList.add('hide');app.classList.remove('hide');await load()}catch(e){loginMsg.textContent=e.message}}async function load(){const j=await rpc('sigma_admin_list_tenants',{p_admin_token:adminToken});if(!j.ok){sessionStorage.removeItem('sigma_admin_token');location.reload();return}all=j.tenants||[];render()}function render(){const q=$('q').value.toLowerCase(),f=$('filter').value,d=all.filter(x=>(!f||x.status===f)&&(!q||[x.cafe_name,x.tenant_code,x.slug,x.owner_name].filter(Boolean).join(' ').toLowerCase().includes(q)));total.textContent=all.length;active.textContent=all.filter(x=>x.status==='active').length;trial.textContent=all.filter(x=>x.status==='trial').length;expired.textContent=all.filter(x=>x.status==='expired').length;list.innerHTML=d.length?d.map(x=>`<article class="tenant"><div class="head"><div><div class="name">☕ ${esc(x.cafe_name)}</div><div class="muted">Kode: ${esc(x.tenant_code)} · Owner: ${esc(x.owner_name||'-')} · Paket: ${esc(x.package_name||'-')}</div></div><div><span class="pill ${x.status}">${esc(x.status).toUpperCase()}</span>${x.expires_at?`<div class="muted">Exp: ${new Date(x.expires_at).toLocaleDateString('id-ID')}</div>`:''}</div></div><div class="mods">${mods(x.slug)}</div></article>`).join(''):'<div class="muted">Belum ada penyewa.</div>'}function mods(s){return [['▦','QR Meja','qr-meja'],['🛒','Pelanggan','customer'],['▣','Kasir','kasir'],['♨','Dapur','dapur'],['◉','Owner','owner'],['▤','Stokis','stokis']].map(x=>`<a class="mod" href="/tenant/${x[2]}.html?tenant=${encodeURIComponent(s)}">${x[0]}<br>${x[1]}</a>`).join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function saveTenant(){formMsg.textContent='Menyimpan...';try{const j=await rpc('sigma_create_tenant',{p_admin_token:adminToken,p_cafe_name:cafe.value,p_tenant_code:code.value,p_slug:slug.value,p_owner_name:owner.value,p_package:package.value,p_days:Number(days.value),p_login_id:loginid.value,p_password:pw.value});if(!j.ok)throw Error(j.message);formMsg.textContent='Berhasil dibuat. ID login: '+j.login_id;await load();setTimeout(()=>{modal.style.display='none';formMsg.textContent=''},900)}catch(e){formMsg.textContent=e.message}}loginBtn.onclick=login;add.onclick=()=>modal.style.display='flex';cancel.onclick=()=>modal.style.display='none';save.onclick=saveTenant;logout.onclick=()=>{sessionStorage.removeItem('sigma_admin_token');location.reload()};q.oninput=render;filter.onchange=render;pass.onkeydown=e=>e.key==='Enter'&&login();let saved=sessionStorage.getItem('sigma_admin_token');if(saved){adminToken=saved;login.classList.add('hide');app.classList.remove('hide');load().catch(()=>location.reload())}</script></body></html>
