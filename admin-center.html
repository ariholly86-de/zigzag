<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sigma Cafe — Admin Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#172033}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:#172033;color:#fff;border-radius:20px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px}.muted{color:#687386}.hero .muted{color:#cbd3df}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px #0000000b}.num{font-size:30px;font-weight:800}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}input{flex:1;min-width:200px}button{background:#172033;color:#fff;cursor:pointer}.tenant{border-top:1px solid #edf0f4;padding:18px 0}.tenant-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.tenant-name{font-size:18px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.trial{background:#fff3c4;color:#8a5b00}.active{background:#dcfce7;color:#166534}.suspended,.expired{background:#fee2e2;color:#991b1b}.modules{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.mod{display:block;text-decoration:none;background:#f6f8fa;color:#172033;border:1px solid #e5e8ed;padding:11px 8px;border-radius:10px;text-align:center;font-size:12px;font-weight:700}.mod:hover{background:#e9edf2}.small{font-size:13px;color:#687386}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.modules{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.wrap{padding:14px}.modules{grid-template-columns:repeat(2,1fr)}} </style></head><body><main class="wrap"><section class="hero"><h1>Σ Sigma Cafe</h1><div class="muted">Commercial Admin Center — pusat pengelolaan seluruh cafe penyewa.</div></section><section class="stats"><div class="card"><div class="small">Total Penyewa</div><div class="num" id="total">0</div></div><div class="card"><div class="small">Aktif</div><div class="num" id="active">0</div></div><div class="card"><div class="small">Trial</div><div class="num" id="trial">0</div></div><div class="card"><div class="small">Expired</div><div class="num" id="expired">0</div></div></section><div class="toolbar"><input id="q" placeholder="Cari nama cafe / kode..."><select id="filter"><option value="">Semua status</option><option value="active">Aktif</option><option value="trial">Trial</option><option value="suspended">Suspended</option><option value="expired">Expired</option></select><button id="refresh">↻ Refresh</button></div><section class="card"><h2 style="margin-top:0">Daftar Penyewa</h2><div id="list"><div class="muted">Memuat...</div></div></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co';const K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let all=[];async function load(){const r=await fetch(U+'/rest/v1/sigma_tenants?select=id,tenant_code,cafe_name,slug,owner_name,status,package_name,expires_at&order=created_at.asc',{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(await r.text());all=await r.json();render()}function render(){const q=document.getElementById('q').value.toLowerCase();const f=document.getElementById('filter').value;const d=all.filter(x=>(!f||x.status===f)&&(!q||[x.cafe_name,x.tenant_code,x.slug,x.owner_name].filter(Boolean).join(' ').toLowerCase().includes(q)));total.textContent=all.length;active.textContent=all.filter(x=>x.status==='active').length;trial.textContent=all.filter(x=>x.status==='trial').length;expired.textContent=all.filter(x=>x.status==='expired').length;list.innerHTML=d.length?d.map(x=>`<article class="tenant"><div class="tenant-head"><div><div class="tenant-name">☕ ${esc(x.cafe_name)}</div><div class="small">Kode: ${esc(x.tenant_code)} · ${esc(x.owner_name||'Owner belum diisi')} · Paket: ${esc(x.package_name||'commercial')}</div></div><div><span class="pill ${x.status}">${esc(x.status).toUpperCase()}</span>${x.expires_at?`<div class="small" style="margin-top:5px">Exp: ${new Date(x.expires_at).toLocaleDateString('id-ID')}</div>`:''}</div></div><div class="modules">${mods(x.slug)}</div></article>`).join(''):'<div class="muted">Tidak ada penyewa.</div>'}function mods(slug){const a=[['▦','QR Meja','qr-meja'],['🛒','Pelanggan','customer'],['▣','Kasir','kasir'],['♨','Dapur','dapur'],['◉','Owner','owner'],['▤','Stokis','stokis']];return a.map(m=>`<a class="mod" href="/tenant/${m[2]}.html?tenant=${encodeURIComponent(slug)}">${m[0]}<br>${m[1]}</a>`).join('')}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}q.oninput=render;filter.onchange=render;refresh.onclick=()=>load().catch(e=>list.innerHTML='<div class="muted">Backend tidak dapat dihubungi: '+esc(e.message)+'</div>');load().catch(e=>list.innerHTML='<div class="muted">Backend tidak dapat dihubungi.</div>');</script></body></html>
