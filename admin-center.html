<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issho Cafe Admin Center</title><style>body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;color:#172033}.wrap{max-width:1100px;margin:auto;padding:28px}.hero{background:#172033;color:#fff;border-radius:18px;padding:26px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 14px #0001}.num{font-size:28px;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select,button{padding:12px;border:1px solid #d8dce5;border-radius:10px;font-size:14px}button{cursor:pointer;background:#172033;color:#fff}.tenant{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #eee;padding:18px 0}.pill{padding:6px 10px;border-radius:99px;background:#eef2f7;font-size:12px}.active{background:#dcfce7;color:#166534}.trial{background:#fef3c7;color:#92400e}.expired,.suspended{background:#fee2e2;color:#991b1b}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.tenant{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section class="hero"><h1>☕ Issho Cafe Admin Center</h1><p>Panel pusat untuk mengelola cafe penyewa Commercial Edition.</p></section><section class="grid"><div class="card"><div>Total Cafe</div><div class="num" id="total">0</div></div><div class="card"><div>Aktif</div><div class="num" id="active">0</div></div><div class="card"><div>Trial</div><div class="num" id="trial">0</div></div><div class="card"><div>Expired</div><div class="num" id="expired">0</div></div></section><div class="toolbar"><input id="q" placeholder="Cari nama cafe..."><select id="filter"><option value="">Semua status</option><option>active</option><option>trial</option><option>suspended</option><option>expired</option></select><button onclick="alert('Form tambah cafe akan dihubungkan ke backend tenant berikutnya.')">+ Tambah Cafe</button></div><section class="card"><h2>Daftar Penyewa</h2><div id="list"><p>Belum ada tenant. Admin Center siap digunakan setelah cafe pertama dibuat.</p></div></section></main><script>const SUPABASE_URL='https://xvhimyflrqrdudijwjdn.supabase.co';async function load(){try{const r=await fetch(SUPABASE_URL+'/rest/v1/commercial_tenants?select=id,cafe_name,slug,status,package_name,expires_at,owner_name&order=created_at.desc',{headers:{apikey:'PUBLIC_ANON_KEY'}});if(!r.ok)throw 0;const d=await r.json();render(d)}catch(e){document.querySelector('#list').innerHTML='<p>Backend tenant belum dikonfigurasi pada halaman publik.</p>'}}function render(d){total.textContent=d.length;active.textContent=d.filter(x=>x.status==='active').length;trial.textContent=d.filter(x=>x.status==='trial').length;expired.textContent=d.filter(x=>x.status==='expired').length;list.innerHTML=d.length?d.map(x=>`<div class="tenant"><div><b>☕ ${esc(x.cafe_name)}</b><br><small>${esc(x.owner_name||'')} · ${esc(x.package_name||'')}</small></div><div><span class="pill ${x.status}">${x.status.toUpperCase()}</span><br><small>${x.expires_at?'Exp: '+new Date(x.expires_at).toLocaleDateString('id-ID'):''}</small></div></div>`).join(''):'<p>Belum ada tenant.</p>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#q').oninput=()=>load();document.querySelector('#filter').onchange=()=>load();load();</script></body></html>
