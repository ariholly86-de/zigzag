<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkGuard Dashboard</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:900px;margin:5vh auto;padding:24px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.muted{color:#667085}.value{font-size:1.25rem;font-weight:700}.map{margin-top:14px;width:100%;height:420px;border:0;border-radius:16px;background:#eef2f7}</style></head><body><main><h1>LinkGuard Dashboard</h1><p class="muted">Pemantauan sesi berbasis izin pengguna. Data diperbarui otomatis.</p><div class="card"><b>Token sesi</b><div id="token" class="muted"></div></div><br><div class="grid"><div class="card"><b>Status</b><div id="status" class="value">—</div></div><div class="card"><b>Lokasi</b><div id="loc" class="value">—</div></div><div class="card"><b>Akurasi</b><div id="acc" class="value">—</div></div><div class="card"><b>Kamera</b><div id="cam" class="value">—</div></div><div class="card"><b>Lokasi Permission</b><div id="gps" class="value">—</div></div><div class="card"><b>Last update</b><div id="last" class="value">—</div></div></div><div class="card" style="margin-top:14px"><b>Peta</b><iframe id="map" class="map" title="Lokasi sesi"></iframe></div></main><script>const SB_URL='https://xvhimyflrqrdudijwjdn.supabase.co',SB_KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',token=new URLSearchParams(location.search).get('token');document.getElementById('token').textContent=token||'Token tidak ada';async function rpc(name,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}function esc(v){return v==null?'—':String(v)}async function refresh(){if(!token){document.getElementById('status').textContent='Token tidak ada';return}try{const d=await rpc('get_tracking_session',{p_token:token});const s=Array.isArray(d)?d[0]:d;if(!s){document.getElementById('status').textContent='Tidak ditemukan';return}document.getElementById('status').textContent=s.status==='ACTIVE'?'🟢 ONLINE':s.status;document.getElementById('cam').textContent=s.camera_permission?'✓ Diizinkan':'Belum';document.getElementById('gps').textContent=s.location_permission?'✓ Diizinkan':'Belum';document.getElementById('acc').textContent=s.accuracy!=null?'± '+Math.round(s.accuracy)+' m':'—';document.getElementById('loc').textContent=s.latitude!=null?s.latitude.toFixed(6)+', '+s.longitude.toFixed(6):'—';document.getElementById('last').textContent=s.last_seen_at?new Date(s.last_seen_at).toLocaleString('id-ID'):'—';if(s.latitude!=null&&s.longitude!=null)document.getElementById('map').src='https://www.openstreetmap.org/export/embed.html?bbox='+(s.longitude-0.01)+'%2C'+(s.latitude-0.01)+'%2C'+(s.longitude+0.01)+'%2C'+(s.latitude+0.01)+'&layer=mapnik&marker='+s.latitude+'%2C'+s.longitude}catch(e){document.getElementById('status').textContent='Error: '+e.message}}refresh();setInterval(refresh,3000);</script></body></html>
