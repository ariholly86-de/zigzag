<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkGuard — Buat Link Lokasi</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:760px;margin:6vh auto;padding:24px}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.link{margin-top:16px;padding:16px;background:#f1f4f8;border-radius:12px;word-break:break-all}.muted{color:#667085;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btn{display:inline-block;padding:11px 14px;border-radius:10px;background:#172033;color:#fff;text-decoration:none;font-weight:700;cursor:pointer;border:0}h1{margin-bottom:8px}</style></head><body><main><div class="card"><h1>LinkGuard</h1><p class="muted">Buat satu link untuk membagikan lokasi perangkat. Sistem ini menggunakan GPS browser dan <b>tidak menggunakan kamera</b>.</p><button id="create">Buat Link Lokasi</button><div id="result"></div><p class="muted">Saat penerima membuka link, browser akan meminta izin lokasi. Setelah disetujui, posisi dikirim otomatis ke dashboard selama halaman tetap terbuka.</p></div></main><script>const SB_URL='https://xvhimyflrqrdudijwjdn.supabase.co',SB_KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';async function rpc(name,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());return r.json()}document.getElementById('create').onclick=async()=>{const b=document.getElementById('create'),out=document.getElementById('result');b.disabled=true;b.textContent='Membuat link…';try{const data=await rpc('create_tracking_session');const row=Array.isArray(data)?data[0]:data;const token=row.session_token||row.token;const link=location.origin+'/track.html?token='+encodeURIComponent(token);const dash=location.origin+'/dashboard.html?token='+encodeURIComponent(token);const wa='https://wa.me/?text='+encodeURIComponent('Silakan buka link lokasi ini: '+link);out.innerHTML='<div class="link"><b>LINK YANG DIKIRIM:</b><br><span id="shareLink">'+link+'</span><div class="actions"><button class="btn" id="copy">Salin Link</button><a class="btn" href="'+wa+'" target="_blank" rel="noopener">Kirim via WhatsApp</a></div></div><div class="link"><b>DASHBOARD MONITORING:</b><br><a href="'+dash+'" target="_blank">Buka Dashboard</a></div>';document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(link);document.getElementById('copy').textContent='✓ Tersalin'}}catch(e){out.innerHTML='<div class="link">Gagal membuat sesi: '+e.message+'</div>'}finally{b.disabled=false;b.textContent='Buat Link Lokasi'}};</script></body></html>
