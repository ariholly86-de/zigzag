<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkGuard Admin</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:760px;margin:6vh auto;padding:24px}.card{background:#fff;border-radius:20px;padding:28px;box-shadow:0 10px 35px #0001}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.link{margin-top:16px;padding:14px;background:#f1f4f8;border-radius:12px;word-break:break-all}.muted{color:#667085;line-height:1.6}a{color:#1769e0;font-weight:700}code{background:#eef2f7;padding:2px 5px;border-radius:5px}</style></head><body><main><div class="card"><h1>LinkGuard</h1><p class="muted">Buat sesi pemantauan yang meminta izin kamera dan lokasi secara jelas kepada pengguna.</p><button id="create">Buat Link Sesi</button><div id="result"></div><p class="muted">Setelah link dibuat, kirim link tersebut melalui WhatsApp. Pengguna harus menekan Mulai Sesi dan menyetujui permission browser.</p></div></main><script>const SB_URL='https://xvhimyflrqrdudijwjdn.supabase.co',SB_KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';async function rpc(name,body){const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());return r.json()}document.getElementById('create').onclick=async()=>{const b=document.getElementById('create'),out=document.getElementById('result');b.disabled=true;b.textContent='Membuat sesi...';try{const data=await rpc('create_tracking_session');const row=Array.isArray(data)?data[0]:data;const token=row.session_token||row.token;const link=location.origin+'/track.html?token='+encodeURIComponent(token);const dash=location.origin+'/dashboard.html?token='+encodeURIComponent(token);out.innerHTML='<div class="link"><b>Link untuk dikirim:</b><br>'+link+'<br><br><a href="'+link+'" target="_blank">Buka link</a></div><div class="link"><b>Dashboard sesi:</b><br><a href="'+dash+'" target="_blank">'+dash+'</a></div>'}catch(e){out.innerHTML='<div class="link">Gagal membuat sesi: '+e.message+'</div>'}finally{b.disabled=false;b.textContent='Buat Link Sesi'}};</script></body></html>
