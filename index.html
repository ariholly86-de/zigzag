<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkGuard</title><style>body{font-family:system-ui,sans-serif;background:#f5f7fb;margin:0;color:#172033}main{max-width:520px;margin:8vh auto;padding:28px;background:#fff;border-radius:20px;box-shadow:0 10px 35px #0001}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:16px;font-weight:700}p{line-height:1.6;color:#657086}.status{padding:12px;background:#f1f4f8;border-radius:12px;margin:12px 0}video{width:100%;border-radius:16px;background:#111;display:none;margin-top:14px}</style></head><body><main><h1>LinkGuard</h1><p>Untuk melanjutkan sesi, Anda dapat memberikan izin kamera depan dan lokasi kepada halaman ini. Akses hanya dimulai setelah Anda menekan tombol dan menyetujui permintaan browser.</p><div class="status" id="status">Status: menunggu persetujuan</div><button id="start">Mulai Sesi</button><video id="preview" autoplay playsinline muted></video></main><script>const statusEl=document.getElementById('status'),video=document.getElementById('preview');async function start(){try{statusEl.textContent='Meminta izin kamera...';const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;video.style.display='block';statusEl.textContent='Kamera diizinkan. Meminta lokasi...';navigator.geolocation.getCurrentPosition(p=>{statusEl.textContent='Sesi aktif • GPS ±'+Math.round(p.coords.accuracy)+' m • '+p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)},e=>{statusEl.textContent='Kamera aktif, tetapi lokasi belum diizinkan: '+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:0});}catch(e){statusEl.textContent='Akses belum diberikan: '+e.message;}}document.getElementById('start').onclick=start;</script></body></html>
