<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIGMA CAFE — Admin Center</title><style>:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#172033,#34425e);color:#fff;border-radius:22px;padding:28px;box-shadow:0 12px 35px #17203325}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;opacity:.82}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.stat,.tenant{background:#fff;border:1px solid #e7eaf0;border-radius:16px;padding:18px;box-shadow:0 4px 18px #1720330b}.stat b{display:block;font-size:28px;margin-top:6px}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.toolbar input,.toolbar select{padding:12px 14px;border:1px solid #d9dee8;border-radius:11px;font:inherit;background:#fff}.tenants{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tenant h2{margin:0 0 4px}.meta{color:#687386;font-size:13px}.status{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:700;text-transform:uppercase;background:#fff3cd;color:#8a6100}.active{background:#dcfce7;color:#166534}.suspended,.expired{background:#fee2e2;color:#991b1b}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.module{padding:10px;border-radius:10px;background:#f6f7fa;text-decoration:none;color:#172033;font-size:13px;font-weight:600}.module:hover{background:#e9edf4}.note{margin-top:18px;padding:14px;background:#fff8e7;border:1px solid #f3df9b;border-radius:12px;font-size:13px}@media(max-width:760px){.stats,.tenants{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>☕ SIGMA CAFE</h1><p>Commercial Admin Center — pusat kontrol aplikasi untuk seluruh cafe penyewa.</p></section><section class="stats"><div class="stat">Total Penyewa<b id="total">0</b></div><div class="stat">Aktif<b id="active">0</b></div><div class="stat">Trial<b id="trial">0</b></div><div class="stat">Nonaktif<b id="inactive">0</b></div></section><div class="toolbar"><input id="search" placeholder="Cari cafe..."><select id="filter"><option value="">Semua status</option><option value="trial">Trial</option><option value="active">Aktif</option><option value="suspended">Suspended</option><option value="expired">Expired</option></select></div><section id="list" class="tenants"><div class="tenant">Memuat data penyewa...</div></section><div class="note">SIGMA CAFE memakai tabel <b>sigma_*</b> khusus untuk sistem komersial. Tidak ada tabel produksi Issho Cafe yang diubah oleh Admin Center ini.</div></main><script>const SB='https://xvhimyflrqrdudijwjdn.supabase.co';const KEY='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';let rows=[];async function load(){try{const r=await fetch(SB+'/rest/v1/sigma_tenants?select=id,tenant_code,cafe_name,slug,owner_name,status,package_name,expires_at&order=created_at.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error('HTTP '+r.status);rows=await r.json();render()}catch(e){document.querySelector('#list').innerHTML='<div class="tenant"><b>Backend belum dapat dibaca.</b><div class="meta">Periksa koneksi Supabase komersial.</div></div>'}}function render(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;const d=rows.filter(x=>(!q||(x.cafe_name+' '+x.tenant_code).toLowerCase().includes(q))&&(!f||x.status===f));document.querySelector('#total').textContent=rows.length;document.querySelector('#active').textContent=rows.filter(x=>x.status==='active').length;document.querySelector('#trial').textContent=rows.filter(x=>x.status==='trial').length;document.querySelector('#inactive').textContent=rows.filter(x=>['suspended','expired'].includes(x.status)).length;document.querySelector('#list').innerHTML=d.map(x=>{const base='/tenant/'+encodeURIComponent(x.slug);return '<article class="tenant"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2>'+esc(x.cafe_name)+'</h2><div class="meta">Kode: '+esc(x.tenant_code)+' · '+esc(x.owner_name||'Belum diisi')+'</div></div><span class="status '+x.status+'">'+x.status+'</span></div><div class="modules"><a class="module" href="'+base+'/qr-meja.html">▦ QR Meja</a><a class="module" href="'+base+'/customer.html">👤 Pelanggan</a><a class="module" href="'+base+'/kasir.html">▣ Kasir</a><a class="module" href="'+base+'/dapur.html">♨ Dapur</a><a class="module" href="'+base+'/owner.html">◆ Owner</a><a class="module" href="'+base+'/stokis.html">▤ Stokis Barang</a></div></article>'}).join('')||'<div class="tenant">Tidak ada penyewa sesuai pencarian.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;load()</script></body></html>
