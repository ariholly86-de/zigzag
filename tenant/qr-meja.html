<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Meja — Sigma Cafe</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.w{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.hero{background:#172033;color:#fff}.hero p{color:#cbd3df}.bar{display:flex;gap:10px;flex-wrap:wrap}.bar a,.bar button,.actions a,.actions button{padding:11px 15px;border-radius:10px;text-decoration:none;border:0;background:#172033;color:#fff;font-weight:700;cursor:pointer}.danger{background:#fff0f0!important;color:#991b1b!important}.muted{color:#687386}.msg{padding:12px;border-radius:10px;background:#eef3f8}.tables{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.table{padding:16px;border:1px solid #e1e6ed;border-radius:12px;background:#f8fafc}.table h3{margin:0 0 6px}.url{width:100%;padding:10px;border:1px solid #d8dee8;border-radius:9px;background:#fff;color:#53627a;font-size:13px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions a{display:inline-block}.copy{background:#304a73!important}@media(max-width:700px){.tables{grid-template-columns:1fr}}</style></head><body><main class="w"><section class="hero"><h1>▦ QR Meja</h1><p id="meta">Memverifikasi sesi tenant...</p></section><section class="card"><h2 id="title">QR Meja Cafe</h2><p id="status" class="muted">Memuat...</p><div class="msg">Setiap meja mempunyai <b>link pelanggan sendiri</b>. Link bisa langsung dibuka atau disalin untuk dibuat QR dan dikirim ke pelanggan.</div><div id="tables" class="tables" style="margin-top:14px"></div></section><section class="card"><div class="bar"><a id="back" href="#">← Dashboard Cafe</a><button id="logout" class="danger">Keluar</button></div></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',s=new URLSearchParams(location.search).get('tenant')||'kva';function getToken(){const legacy=sessionStorage.getItem('sigma_tenant_token');if(legacy&&!localStorage.getItem('sigma_tenant_token'))localStorage.setItem('sigma_tenant_token',legacy);return localStorage.getItem('sigma_tenant_token')}async function rpc(n,b){const r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});return await r.json()}function copyLink(url,button){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(url).then(()=>{button.textContent='Tersalin ✓';setTimeout(()=>button.textContent='Salin',1200)}).catch(()=>fallback(url,button))}else fallback(url,button)}function fallback(url,button){const x=document.createElement('textarea');x.value=url;x.style.position='fixed';x.style.opacity='0';document.body.appendChild(x);x.select();try{document.execCommand('copy');button.textContent='Tersalin ✓';setTimeout(()=>button.textContent='Salin',1200)}finally{x.remove()}}async function init(){const token=getToken();if(!token){location.href='index.html?tenant='+encodeURIComponent(s);return}const j=await rpc('sigma_tenant_session_context',{p_token:token});if(!j.ok||j.slug!==s){localStorage.removeItem('sigma_tenant_token');sessionStorage.removeItem('sigma_tenant_token');location.href='index.html?tenant='+encodeURIComponent(s);return}title.textContent='QR Meja — '+j.cafe_name;meta.textContent='Tenant '+j.tenant_code+' · '+String(j.status).toUpperCase();status.textContent='Paket '+(j.package_name||'-')+' · Berakhir '+(j.expires_at?new Date(j.expires_at).toLocaleDateString('id-ID'):'-');back.href='index.html?tenant='+encodeURIComponent(s);const base=location.origin;tables.innerHTML=Array.from({length:50},(_,i)=>{const n=i+1,url=base+'/tenant/customer.html?tenant='+encodeURIComponent(s)+'&table='+n;return `<div class="table"><h3>MEJA ${n}</h3><div class="url">${url}</div><div class="actions"><a href="${url}">Buka Link</a><button class="copy" onclick="copyLink('${url.replace(/'/g,"\\'")}',this)">Salin Link</button></div></div>`}).join('')}logout.onclick=()=>{localStorage.removeItem('sigma_tenant_token');sessionStorage.removeItem('sigma_tenant_token');location.href='index.html?tenant='+encodeURIComponent(s)};init();</script></body></html>
