<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pelanggan — Sigma Cafe</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.w{max-width:1000px;margin:auto;padding:18px}.hero,.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 5px 22px #0001}.hero{background:#172033;color:#fff}.hero p{color:#cbd3df}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid #e1e6ed;border-radius:14px;padding:14px}.item h3{margin:0 0 6px}.price{font-weight:800}.muted{color:#687386}.msg{padding:12px;border-radius:10px;background:#eef3f8}.table{font-size:22px;font-weight:800}.wa{display:flex;gap:8px}.wa input{flex:1;padding:12px;border:1px solid #d7dce5;border-radius:10px;font:inherit}button{padding:12px 15px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:700;cursor:pointer}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wa{flex-direction:column}}</style></head><body><main class="w"><section class="hero"><h1>🛒 <span id="cafe">Pelanggan</span></h1><p id="meta">Menu online cafe</p></section><section class="card"><div id="table" class="table"></div><p id="status" class="muted">Memuat menu...</p><div class="msg">Anda membuka link pelanggan. Tidak perlu login admin/penyewa untuk melihat menu.</div></section><section class="card"><h2>Nomor WhatsApp</h2><div class="wa"><input id="wa" inputmode="tel" placeholder="08xxxxxxxxxx"><button id="save">Simpan</button></div><p id="saved" class="muted"></p></section><section class="card"><h2>Menu</h2><div id="menu" class="grid"></div></section></main><script>const U='https://slgsatwftgirgiyzzzkf.supabase.co',K='sb_publishable_t0vljkZIkW3FJP2kSzAljg_iubUAHq3',SYNC=U+'/functions/v1/sync-catalog-v2?key=SigmaSync-20260830-7Qm9',q=new URLSearchParams(location.search),s=q.get('tenant')||'kva',table=q.get('table');const $=id=>document.getElementById(id);async function api(path){const r=await fetch(U+'/rest/v1/'+path,{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error('Gagal mengambil data');return r.json()}async function init(){try{await fetch(SYNC,{cache:'no-store'}).catch(()=>null);const tenants=await api('sigma_tenants?select=cafe_name,tenant_code,status,package_name,expires_at&slug=eq.'+encodeURIComponent(s)+'&limit=1');const t=tenants[0];if(!t){$('cafe').textContent='Cafe';$('meta').textContent='Tenant tidak ditemukan';return}$('cafe').textContent=t.cafe_name;$('meta').textContent='Tenant '+t.tenant_code+' · '+String(t.status).toUpperCase();$('status').textContent='Paket '+(t.package_name||'commercial')+(t.expires_at?' · Berakhir '+new Date(t.expires_at).toLocaleDateString('id-ID'):'');if(table)$('table').textContent='MEJA '+table;const products=await api('products?select=id,name,description,price,image_url&active=eq.true&order=sort_order.asc,name.asc');$('menu').innerHTML=products.length?products.map(p=>'<div class="item"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||'')+'</p><div class="price">Rp '+Number(p.price||0).toLocaleString('id-ID')+'</div></div>').join(''):'<div class="msg">Menu belum tersedia.</div>'}catch(e){$('status').textContent='Menu belum dapat dimuat. Silakan coba lagi.'}}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;')}const old=localStorage.getItem('sigma_customer_wa_'+s);if(old)$('wa').value=old;$('save').onclick=()=>{const v=$('wa').value.trim();localStorage.setItem('sigma_customer_wa_'+s,v);$('saved').textContent='Nomor WhatsApp tersimpan.'};init();</script></body></html>
