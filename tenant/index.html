<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Cafe — Sigma</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f4f6f8;color:#172033}.w{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.hero{background:#172033;color:#fff}.muted{color:#6b7585}.hero .muted{color:#cbd3df}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mod{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:20px;text-decoration:none;color:#172033;font-weight:800;box-shadow:0 4px 15px #00000008}.mod small{display:block;color:#6b7585;font-weight:500;margin-top:6px}button{padding:11px 14px;border:0;border-radius:10px;background:#172033;color:#fff;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><section class="hero"><h1 id="name">Sigma Cafe</h1><div id="meta" class="muted">Memuat data tenant...</div></section><section class="card"><h2>Aplikasi Cafe</h2><div id="links" class="grid"></div></section><section class="card"><a href="../admin-center.html"><button>← Admin Center</button></a></section></main><script>const s=new URLSearchParams(location.search).get('tenant')||'kva';const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St';const modules=[['qr-meja','▦','QR Meja','Buat dan kelola QR meja'],['customer','🛒','Pelanggan','Menu, WhatsApp, dan pesanan'],['kasir','▣','Kasir','Order dan pembayaran'],['dapur','♨','Dapur','Antrean produksi realtime'],['owner','◉','Owner','Laporan dan pengaturan'],['stokis','▤','Stok Barang','Persediaan dan pergerakan stok']];async function init(){const r=await fetch(U+'/rest/v1/sigma_tenants?select=cafe_name,tenant_code,status,package_name,expires_at&slug=eq.'+encodeURIComponent(s),{headers:{apikey:K,Authorization:'Bearer '+K}});const d=await r.json();const t=d[0];if(!t){name.textContent='Tenant tidak ditemukan';return}name.textContent='☕ '+t.cafe_name;meta.textContent='Kode '+t.tenant_code+' · '+String(t.status).toUpperCase()+' · Paket '+(t.package_name||'commercial')+(t.expires_at?' · Berakhir '+new Date(t.expires_at).toLocaleDateString('id-ID'):'');links.innerHTML=modules.map(m=>`<a class="mod" href="${m[0]}.html?tenant=${encodeURIComponent(s)}">${m[1]} ${m[2]}<small>${m[3]}</small></a>`).join('')}init().catch(()=>meta.textContent='Gagal memuat data tenant.');</script></body></html>
