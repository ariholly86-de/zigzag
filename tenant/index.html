<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Cafe — Sigma</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#172033}.w{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 5px 22px #0001}.hero{background:#172033;color:#fff}.muted{color:#6b7585}.hero .muted{color:#cbd3df}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mod{background:#fff;border:1px solid #e1e6ed;border-radius:14px;padding:20px;text-decoration:none;color:#172033;font-weight:800;box-shadow:0 4px 15px #00000008}.mod small{display:block;color:#6b7585;font-weight:500;margin-top:6px}.login{max-width:560px;margin:40px auto}input,button{width:100%;padding:13px;border:1px solid #d7dce5;border-radius:10px;font:inherit}button{background:#172033;color:#fff;cursor:pointer;margin-top:10px}.danger{background:#fff0f0;color:#991b1b}.msg{padding:11px;border-radius:10px;background:#eef3f8;margin-top:10px}.hide{display:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.top button{width:auto;margin:0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:450px){.grid{grid-template-columns:1fr}.w{padding:14px}}</style></head><body><main class="w"><section class="hero"><h1 id="name">Sigma Cafe</h1><div id="meta" class="muted">Dashboard penyewa</div></section><section id="login" class="card login"><h2>Login Penyewa</h2><p class="muted">Masukkan ID dan password yang dibuat Admin Sigma.</p><input id="loginid" autocomplete="username" placeholder="ID Penyewa"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" type="button">Masuk ke Cafe</button><div id="loginMsg" class="msg hide"></div></section><section id="app" class="hide"><section class="card"><div class="top"><div><h2 style="margin:0 0 6px">Dashboard <span id="cafeName"></span></h2><div id="info" class="muted"></div></div><button id="logout" class="danger" type="button">Keluar</button></div></section><section class="card"><h2>Aplikasi Cafe</h2><div id="links" class="grid"></div></section></section></main><script>const U='https://xvhimyflrqrdudijwjdn.supabase.co',K='sb_publishable_WHyroGN6czktqO5F8L4Xng_P7p5a3St',slug=new URLSearchParams(location.search).get('tenant')||'kva',modules=[['qr-meja','▦','QR Meja','Kelola QR meja pelanggan'],['customer','🛒','Pelanggan','Menu, WhatsApp, dan pesanan'],['kasir','▣','Kasir','Order dan pembayaran'],['dapur','♨','Dapur','Antrean produksi realtime'],['owner','◉','Owner','Laporan dan pengaturan'],['stokis','▤','Stok Barang','Persediaan dan pergerakan stok']];const $=id=>document.getElementById(id);async function rpc(n,b){const r=await fetch(U+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.message||'Backend error');return j}function showLogin(t){$('name').textContent='☕ '+(t.cafe_name||slug.toUpperCase());$('meta').textContent='Login penyewa diperlukan';$('login').classList.remove('hide');$('app').classList.add('hide')}function showApp(t){$('name').textContent='☕ '+t.cafe_name;$('meta').textContent='Kode '+t.tenant_code+' · '+String(t.status).toUpperCase()+' · Paket '+(t.package_name||'commercial');$('cafeName').textContent=t.cafe_name;$('info').textContent='Owner: '+(t.owner_name||'-')+' · Berakhir: '+(t.expires_at?new Date(t.expires_at).toLocaleDateString('id-ID'):'-');$('links').innerHTML=modules.map(m=>`<a class="mod" href="${m[0]}.html?tenant=${encodeURIComponent(t.slug)}">${m[1]} ${m[2]}<small>${m[3]}</small></a>`).join('');$('login').classList.add('hide');$('app').classList.remove('hide')}async function check(){const token=sessionStorage.getItem('sigma_tenant_token');if(!token){const r=await fetch(U+'/rest/v1/sigma_tenants?select=cafe_name,slug&slug=eq.'+encodeURIComponent(slug),{headers:{apikey:K,Authorization:'Bearer '+K}});const d=await r.json();showLogin(d[0]||{cafe_name:slug.toUpperCase()});return}try{const j=await rpc('sigma_tenant_session_context',{p_token:token});if(!j.ok||j.slug!==slug){sessionStorage.removeItem('sigma_tenant_token');showLogin(j);return}showApp(j)}catch(e){sessionStorage.removeItem('sigma_tenant_token');showLogin({cafe_name:slug.toUpperCase()})}}$('loginBtn').onclick=async()=>{const id=$('loginid').value.trim(),pw=$('password').value;if(!id||!pw){$('loginMsg').textContent='ID dan password wajib diisi.';$('loginMsg').classList.remove('hide');return}$('loginBtn').disabled=true;try{const j=await rpc('sigma_tenant_login',{p_login_id:id,p_password:pw});if(!j.ok)throw Error(j.message||'Login gagal');if(j.tenant_code&&slug!==slug.toLowerCase()){}sessionStorage.setItem('sigma_tenant_token',j.token);await check()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').classList.remove('hide')}finally{$('loginBtn').disabled=false}};$('logout').onclick=()=>{sessionStorage.removeItem('sigma_tenant_token');location.reload()};check();</script></body></html>
