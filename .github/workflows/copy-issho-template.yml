name: Prepare isolated Issho Cafe commercial template
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zigzag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy Issho Cafe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issho
          git clone --depth 1 https://github.com/ariholly86-de/issho-cafe-online-v3.git /tmp/issho
          rm -rf /tmp/issho/.git
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/issho/. .
          mkdir -p .github/workflows
          cat > .github/workflows/copy-issho-template.yml <<'EOF'
name: Prepare isolated Issho Cafe commercial template
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy source
        run: |
          set -euo pipefail
          mkdir -p /tmp/issho
          git clone --depth 1 https://github.com/ariholly86-de/issho-cafe-online-v3.git /tmp/issho
          rm -rf /tmp/issho/.git
          cp -a /tmp/issho/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync isolated Issho Cafe commercial template"
          git push origin HEAD:main
EOF
      - name: Commit template copy
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Create isolated Issho Cafe commercial template"
          git push origin HEAD:main
