name: Copy Issho Cafe template
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zigzag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy Issho Cafe source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issho
          git clone --depth 1 https://github.com/ariholly86-de/issho-cafe-online-v3.git /tmp/issho
          rm -rf /tmp/issho/.git
          cp .github/workflows/copy-issho-template.yml /tmp/copy-issho-template.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/issho/. .
          mkdir -p .github/workflows
          cp /tmp/copy-issho-template.yml .github/workflows/copy-issho-template.yml
      - name: Commit template copy
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Create isolated Issho Cafe commercial template"
          git push origin HEAD:main
